<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor — Family Safety Demo</title><style>body{font-family:system-ui,sans-serif;background:#ece6da;color:#1c2422;display:grid;place-items:center;min-height:100vh;margin:0}.card{max-width:440px;padding:28px;border-radius:20px;background:#fbf8f2;box-shadow:0 8px 24px rgba(28,36,34,.08);text-align:center}</style></head><body><div class="card" id="status"><h1>Harbor</h1><p>Loading family-safety demo…</p></div><script>
(async()=>{try{const names=['part-00.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt'];const chunks=await Promise.all(names.map(async n=>{const r=await fetch(`frontend-bundle/${n}`,{cache:'no-store'});if(!r.ok)throw new Error(`Could not load ${n}`);return r.text()}));const b64=chunks.join('').trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('status').innerHTML=`<h1>Harbor could not load</h1><p>${String(e.message||e)}</p>`;console.error(e)}})();
</script></body></html>
