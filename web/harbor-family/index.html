<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- CSP: sign-in, family reads and Harbor's functions (through its harbor-web gateway) all go to the Supabase project. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; manifest-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0b2027" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>Harbor Family</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/harbor.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="hb-root">
  <section id="auth" class="hf-auth" hidden aria-live="polite"></section>
  <div id="shell" class="hf-shell" hidden>
    <div class="hf-top"><header class="hb-appbar" id="brand"></header><nav class="hf-kids" id="kids" aria-label="Choose child"></nav></div>
    <main id="view" class="hf-view"></main>
    <nav class="hf-dock" id="tabs" aria-label="Main"></nav>
  </div>
  <div id="kshell" class="hf-shell" hidden>
    <div class="hf-top"><header class="hb-appbar" id="kbrand"></header></div>
    <main id="kview" class="hf-view"></main>
    <nav class="hf-dock" id="ktabs" aria-label="Main"></nav>
  </div>
  <div class="hf-mod" id="mod" hidden><div class="hf-scrim"></div><div class="hb-sheet" id="card" role="dialog" aria-modal="true"></div></div>
  <div class="hf-toast" id="toast" aria-live="polite"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
