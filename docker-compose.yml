services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: harbor
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor -d harbor"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - harbor-postgres:/var/lib/postgresql/data

volumes:
  harbor-postgres:
